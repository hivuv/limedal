# LiMedal — Hyprland ayarları
#
# Bu dosyanın içeriğini ~/.config/hypr/hyprland.conf dosyana ekle.
# `limedal hyprland` komutu aynı metni yazdırır.
#
# Pencere: sabit boyut, ortada, gölge ve bulanıklık yok.
# app_id (Wayland) ve sınıf (X11/XWayland) "limedal" olarak ayarlanır.

windowrulev2 = float, class:^(limedal)$
windowrulev2 = center, class:^(limedal)$
windowrulev2 = size 1180 780, class:^(limedal)$
windowrulev2 = noblur, class:^(limedal)$
windowrulev2 = noshadow, class:^(limedal)$

# Global kısayollar: /dev/input dinleyicisine gerek kalmaz.
bind = , F9, exec, limedal clip
bind = , F10, exec, limedal record toggle
bind = SUPER SHIFT, L, exec, limedal open

# Arka planda klip motoru (systemd servisi yerine):
# exec-once = limedal run
