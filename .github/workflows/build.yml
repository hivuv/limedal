name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-release:
    name: Linux x86_64 (release)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libgl1-mesa-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Derle (release)
        run: cargo build --release --verbose

      - name: Duman testi (arayüz açmadan)
        run: |
          ./target/release/limedal version
          ./target/release/limedal help
          ./target/release/limedal status || true

      - name: Paketle (tar.gz + .deb)
        id: pack
        run: |
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          NAME="limedal-$VERSION-linux-x86_64"
          DEB="limedal_${VERSION}_amd64.deb"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          cp target/release/limedal dist/
          cp install.sh uninstall.sh README.md LICENSE dist/
          cp -r desktop systemd packaging dist/
          tar -czf "$NAME.tar.gz" -C dist .
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

          bash packaging/build-deb.sh
          cp "target/deb/$DEB" .
          sha256sum "$DEB" > "$DEB.sha256"

          ls -l "$NAME.tar.gz" "$DEB"

      # Artifact kotası dolduğu için çıktılar doğrudan Release'e yükleniyor:
      # release asset'leri Actions artifact deposundan sayılmaz.
      - name: Release yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.pack.outputs.version }}"
          NAME="${{ steps.pack.outputs.name }}"
          DEB="${{ steps.pack.outputs.deb }}"
          TAG="v$VERSION"
          cat > notes.md <<'EOF'
          Linux (Debian/Ubuntu) için Medal.tv alternatifi: arka planda sürekli oyun
          kaydı tutar, bir tuşa bastığında son N saniyeyi klibe çevirir.

          Kurulum (.deb — Rust gerekmez):

              sudo apt install ./limedal-<sürüm>_amd64.deb
              limedal doctor
              limedal run

          Kurulum (arşiv — kullanıcı dizinine, sudo yok):

              mkdir -p limedal
              tar -xzf limedal-<sürüm>-linux-x86_64.tar.gz -C limedal
              cd limedal && bash install.sh
              limedal doctor
              limedal run

          Gereksinim: ffmpeg (sudo apt install ffmpeg)
          Opsiyonel: pulseaudio-utils (ses kaynakları), libnotify-bin (bildirimler)
          Klipler: ~/Videos/LiMedal
          EOF
          ASSETS=("$NAME.tar.gz" "$NAME.tar.gz.sha256" "$DEB" "$DEB.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "LiMedal $VERSION" \
              --notes-file notes.md
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
